<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커피드가자</title>
    <style>
        *{margin: 0; padding: 0;}
        ul{list-style: none;}
        a{text-decoration: none; color: inherit;}
        header{
            width: 100%;
            border-bottom: 1px solid #777;
        }
        
        header .gnb{
            width: 1140px;
            height: 70px;
            line-height: 70px;
            margin: 0 auto;
        

            display: flex;
            align-items: center;
        }

        header .gnb .logo{
            font-size: 20px;
            font-weight: bold;
        }

        header .gnb .nav{
            margin-left: auto;
            display: flex;
            gap: 25px;
            font-size: 18px;
            color: #555;
        }

        main{
            width: 1140px;
            margin: 0 auto;
        }
        .main-visual{
            width: 100%;
            height: 400px;
            display: flex;
            margin-top: 100px;
            justify-content: space-between;
            align-items: center;
        }

        .main-text{
            width: 400px;
        }
        .main-text h1{
            font-size: 38px;
            margin-bottom: 15px;
        }
        .city-text{
            font-size: 21px;
            line-height: 1.7;
            color: #777;
        }
        .menu-btn{
            display:  inline-block;
            width: 103px;
            height: 49px;
            margin-top: 20px;
            background-color: #d96f1e;
            color: #fff;
            font-size: 16px;
            text-align: center;
            line-height: 49px;
            font-weight: bold;
            border-radius: 10px;
        }
        .main-img{
            width: 570px;
            height: 380px;

        }
        .main-img img{
            width: 100%;
            display: block;
            border-radius: 10px;
        }

        .why{
            margin-top: 200px;
        }
        .why h2{
            font-size: 24px;
            margin-bottom: 20px;
        }
        .bakery{
            display: flex;
            justify-content: space-between;
        }
        .bakery li{
            width: 360px;
            position: relative;
        }
        .bakery li img{
            width: 360px;
            height: 280px;
            display: block;
            border-radius: 8px;
        }
        .bakery li p{
            font-size: 17.6px;
            font-weight: 700;
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            justify-content: center;
            line-height: 70px;
            background-color: #fff;
            width: 100%;
            opacity: 70%;
        }
        .popular{
            margin-top: 200px;
        }
        .popular .popular-menu {
            width: auto;
            height: 280px;
            margin-top: 20px;
            display: flex;
            padding: 20px;
            justify-content: space-between;
            background-color: antiquewhite;
        }
        .popular .popular-menu li{
            width: 353px;
            height: 280px;
            position: relative;
        }
        .popular .popular-menu li img{
            width: 100%;
            height: 280px;
            display: block;
            border-radius: 10px;
        }
        .popular .popular-menu li p{
            width: 150px;
            height: 35px;
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            border-radius: 25px 25px 0 0;
            font-size: 16px;
        }
        footer{
            margin-top: 100px;
            width: 100%;
            height: 130px;
            padding: 40px 0;
            background-color: #222;
            
        }
        footer .footer-text{
            text-align: center;       
        }
        footer .footer-text h2{
            margin-top: 15px;
            margin-bottom: 15px;
            font-size: 21px;
            color: #fff;
        }
        footer .footer-text p{
            color: #aaa;
            font-size: 17px;
        }
        @media screen and (max-width: 1200px){

        header .gnb{
            width: 90%;
        }

        main{
            width: 90%;
        }


        .main-visual{
            height: auto;
            margin-top: 70px;
            flex-direction: column;
            align-items: flex-start;
        }

        .main-text{
            width: 100%;
        }

        .main-img{
            width: 100%;
            height: auto;
            margin-top: 40px;
        }

        .main-img img{
            width: 100%;
        }


        .why{
            margin-top: 120px;
        }

        .bakery{
            flex-direction: column;
            gap: 20px;
        }

        .bakery li{
            width: 100%;
        }

        .bakery li img{
            width: 100%;
            height: auto;
        }


        .popular{
            margin-top: 120px;
        }

        .popular .popular-menu{
            width: auto;
            height: auto;
            flex-direction: column;
            gap: 20px;
        }

        .popular .popular-menu li{
            width: 100%;
            height: auto;
        }

        .popular .popular-menu li img{
            width: 100%;
            height: auto;
        }


        footer h2,
        footer p{
            width: 90%;
        }
    }
    </style>
</head>
<body>
    <header>
        <ul class="gnb"> 
            <li class="logo"><a href="#">BREW & CO</a></li>
            <li class="nav">
                <a href="#">메뉴</a>
                <a href="#">소개</a>
                <a href="#">문의</a>
            </li>
        </ul>
    </header>
    
    <main>
        <section class="main-visual">
            <div class="main-text">
                <h1>커피 한 잔의 여유</h1>

                <p class="city-text">
                    바쁜 도시의 흐름 속에서<br>
                    일상이 잠시 휴가처럼 느껴지는 순간,<br>
                    도심 속 작은 쉼표를 전합니다
                </p>

                <a href="#" class="menu-btn">메뉴보기</a>
            </div>
            <div class="main-img">
                <img src="js/images/photo-1495474472287-4d71bcdd2085.avif" alt="커피사진 ">
            </div>
        </section>

        <section class="why">
            <h2>왜 우리인가?</h2>
            <ul class="bakery">
                <li><img src="js/images/photo-1509042239860-f550ce710b93.avif" alt="원두">
                    <p>스페셜티 원두</p></li>
                <li><img src="js/images/photo-1511920170033-f8396924c348.avif" alt="베이커리">
                    <p>매일 베이커리</p></li>
                <li><img src="js/images/photo-1556742526-795a8eac090e.avif" alt="공간">
                    <p>편안한 공간</p></li>        
            </ul>
        </section>

        <section class="popular">
            <h2>인기 메뉴</h2>
            <ul class="popular-menu">
                <li><img src="js/images/photo-1610632380989-680fe40816c6.avif" alt="인기커피">
                    <p>아메리카노</p></li>
                <li><img src="js/images/premium_photo-1675435644687-562e8042b9db.avif" alt="야무진 커피">
                    <p>카페라떼</p></li>
                <li><img src="js/images/premium_photo-1674327105074-46dd8319164b.avif" alt="지리는 커피">
                    <p>콜드브루</p></li>                 
            </ul>
        </section>
    </main>


    <footer>
        <div class="footer-text">
            <h2>BREW & CO</h2>
            <p>
                서울 마포구 연남동<br>
                @2026 All Rights Reserved
            </p>
        </div>
    </footer>
</body>
</html>
