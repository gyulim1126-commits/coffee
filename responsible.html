<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>basic-반응형페이지</title>
    <style>
        *{margin: 0; padding: 0;}
        ul{list-style: none;}
        a{text-decoration: none; color: inherit;}
        a:hover{color: orange;}

        header{
            width: 1000px;
            height: 50px;
            line-height: 50px;
            background-color: aqua;
            margin: 0 auto;
        }
        .gnb{           
            display: flex;
            justify-content: space-around;
        }
        main{
            width: 1000px;
            margin: 0 auto;
            background-color: antiquewhite;
        }
        .contents{
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px;
        }
        .contents>li{
            width: 320px; height: 300px;
            background-color: aquamarine;
            font-size: clamp(30pt, 4vw, 60pt);
            font-size: ;
            line-height: 300px;
            color: #fff; text-align: center;
        }
        footer{
            width: 1000px;
            margin: 0 auto;
            height: 50px;
            line-height: 50px;
            background-color: blueviolet;
            color: #fff; text-align: center;
        }

        @media (max-width:768px) {
            header{
                width: 90%;
                background-color: yellow;
            }
            main{
                width: 90%;
                background-color: brown;
            }
            .contents{
                gap:1%;
                padding: 1%;
                padding-bottom: 0.2%;
            }
            .contents>li{
                width: 49.5%;
                margin-bottom: 1%;
                background-color: red;
            }
            .contents>li:nth-child(5),
            .contents>li:nth-child(6){
                display: none;
            }
            footer{
                width: 90%;
                background-color:  black;
            }
        }
        @media (max-width:360px){
            header{
                width: 100%;
                height: 200px;
                
            }
            .gnb{
                flex-direction: column;
            }
            .gnb>li{
                height: 50px;
                background-color: chartreuse;
                text-align: center;
                border-bottom: 1px solid #fff;
                box-sizing: border-box;
            }
            main{
                width: 100%;
                background-color: pink;
            }
            .contents{
                display: block;
                padding: 2%;
            }
            .contents>li{
                width: 99.8%;
                background-color: gray;
            }
            .contents>li:nth-child(o z Z z)
        }
        
    </style>
</head>
<body>
    <header>
        <ul class="gnb">
            <li><a href="#">HOME</a></li>
            <li><a href="#">PROFILE</a></li>
            <li><a href="#">PORTFOLIO</a></li>
            <li><a href="#">GALLERY</a></li>
        </ul>
    </header>
    <main>
        <ul class="contents">
            <li>box01</li>
            <li>box02</li>
            <li>box03</li>
            <li>box04</li>
            <li>box05</li>
            <li>box06</li>
        </ul>
    </main>
    <footer>
        <div class="copyrigt">2026 theJoEUN. ALL Rights Reserved.</div>
    </footer>
</body>
</html>
